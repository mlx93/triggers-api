<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔌</text></svg>">
  <title>Zapier Triggers API - Swagger UI</title>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.10.3/swagger-ui.css" />
  <style>
    html {
      box-sizing: border-box;
      overflow: -moz-scrollbars-vertical;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin:0;
      background: #fafafa;
    }
    /* Custom topbar styling */
    .swagger-ui .topbar {
      background-color: #ff4a00;
    }
    .swagger-ui .topbar .download-url-wrapper {
      display: none;
    }
    
    /* Increase spacing between Authorize and Close buttons */
    .swagger-ui .auth-container .authorize-btn-wrapper {
      display: flex;
      gap: 20px;
      justify-content: flex-end;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
    }
    
    /* Better separation between request and response sections */
    .swagger-ui .responses-wrapper {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 3px solid #3b4151;
    }
    
    /* Larger "Responses" heading */
    .swagger-ui .responses-inner h4,
    .swagger-ui .responses-inner h5 {
      font-size: 24px !important;
      font-weight: 700 !important;
      color: #3b4151 !important;
      margin-bottom: 20px !important;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    /* Add visual separation for response section */
    .swagger-ui .response-col_status {
      background: #f7f7f7;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    
    /* Curl section styling */
    .swagger-ui .curl-command {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #e8e8e8;
    }
    
    /* Lock icon styling - show locked by default */
    .swagger-ui .btn.authorize {
      border-color: #cc3700;
    }
    
    .swagger-ui .btn.authorize.unlocked {
      border-color: #49cc90;
    }
    
    /* Increase gap between operation execute buttons */
    .swagger-ui .execute-wrapper {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
    }
    
    /* Make actual server response more prominent */
    .swagger-ui .responses-wrapper {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 3px solid #3b4151;
    }
    
    /* Hide or minimize the "Details" tab (example responses) */
    .swagger-ui .responses-inner .response-col_status {
      background: #f7f7f7;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    
    /* Make the actual live server response stand out */
    .swagger-ui .live-responses-table {
      margin-top: 20px;
      border: 3px solid #49cc90;
      border-radius: 6px;
      padding: 20px;
      background: #f9fff9;
      position: relative;
    }
    
    /* Add "LIVE RESPONSE" label before live response */
    .swagger-ui .live-responses-table::before {
      content: "✓ LIVE RESPONSE";
      display: block;
      background: #49cc90;
      color: white;
      font-weight: 700;
      font-size: 12px;
      padding: 8px 15px;
      border-radius: 4px 4px 0 0;
      margin: -20px -20px 15px -20px;
      letter-spacing: 1px;
    }
    
    /* Make response code more prominent in live response */
    .swagger-ui .live-responses-table .response-col_status {
      font-size: 20px !important;
      font-weight: 700 !important;
      color: #2e7d32 !important;
      background: #e8f5e9;
      padding: 15px;
      border-radius: 4px;
      border-left: 4px solid #49cc90;
      margin-bottom: 15px;
    }
    
    /* Style the actual response body in live response */
    .swagger-ui .live-responses-table .response-col_description {
      background: #fafafa;
      padding: 20px;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
      margin-top: 15px;
      display: block !important;
    }
    
    /* Make response body code block more readable */
    .swagger-ui .live-responses-table pre {
      background: #263238;
      color: #aed581;
      padding: 20px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.6;
      margin: 0;
    }
    
    /* Clear black border separator between live response and example responses */
    .swagger-ui .live-responses-table {
      border-bottom: 4px solid #000000;
      margin-bottom: 30px;
    }
    
    /* Show example responses but make them less prominent */
    .swagger-ui .responses-inner .response:not(.live-response) {
      opacity: 0.7;
      background: #f5f5f5;
      padding: 15px;
      border-radius: 4px;
      margin-top: 20px;
    }
    
    /* Add "EXAMPLE RESPONSES" label before example responses */
    .swagger-ui .responses-inner .response:not(.live-response):first-of-type::before {
      content: "EXAMPLE RESPONSES (from OpenAPI spec)";
      display: block;
      background: #666;
      color: white;
      font-weight: 700;
      font-size: 12px;
      padding: 8px 15px;
      border-radius: 4px;
      margin: -15px -15px 15px -15px;
      letter-spacing: 1px;
    }
    
    /* Make request URL section less prominent */
    .swagger-ui .request-url {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-family: monospace;
      font-size: 12px;
      color: #666;
    }
    
    /* Make CURL section less prominent */
    .swagger-ui .curl {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 12px;
    }
    
    /* Emphasize the "Responses" heading */
    .swagger-ui .responses-inner h4 {
      font-size: 20px !important;
      font-weight: 700 !important;
      color: #3b4151 !important;
      margin-bottom: 15px !important;
      border-bottom: 2px solid #49cc90;
      padding-bottom: 10px;
    }
    
    /* Hide response headers and links in example responses */
    .swagger-ui .response-col_headers,
    .swagger-ui .response-col_links {
      display: none;
    }
    
    /* Show headers and links only in live responses */
    .swagger-ui .live-responses-table .response-col_headers,
    .swagger-ui .live-responses-table .response-col_links {
      display: table-cell;
    }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.10.3/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.10.3/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      // SwaggerUIBundle configuration
      const ui = SwaggerUIBundle({
        url: "./openapi.yaml?v=" + Date.now(),  // Relative path to OpenAPI spec with cache busting
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        validatorUrl: null,  // Disable online validator
        docExpansion: "list",  // Expand only tags by default
        filter: true,  // Enable filter box
        showExtensions: true,
        showCommonExtensions: true,
        tryItOutEnabled: true,  // Enable "Try it out" by default
        supportedSubmitMethods: ['get', 'post', 'put', 'delete', 'patch'],
        oauth2RedirectUrl: window.location.origin + "/docs/swagger-ui/oauth2-redirect.html"
      });
      
      window.ui = ui;
    };
  </script>
</body>
</html>
